<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title-id">Pico Monitoring | Dashboard</title>
    <script src="/chart.js"></script>
    <style>
        /* Apple System / iOS Style Variables */
        :root {
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-primary: #1C1C1E;
            --text-secondary: #8E8E93;
            --accent-blue: #007AFF;
            --accent-green: #34C759;
            --accent-red: #FF3B30;
            --border-color: #E5E5EA;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            display: flex;
            position: relative;
            justify-content: space-evenly;
            flex-flow: column;
            gap: 15px;
        }

        .card_text {
            display: flex;
            flex-flow: row;
            font-size: 12px;
            color: var(--text-secondary);
            font-family: monospace;
            align-items: center;
            gap: 6px;
        }

        .sys-val {
            color: var(--text-primary);
            font-weight: 600;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .dot.active {
            background-color: var(--accent-green);
            box-shadow: 0 0 6px rgba(52, 199, 89, 0.4);
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 0.5px solid var(--border-color);
            box-shadow: var(--shadow);
            display: flex;
            flex-flow: column;
            position: relative;
            justify-content: space-evenly;
        }

        .card-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .card-value {
            font-size: 28px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.5px;
        }

        .gauge-container {
            width: 100%;
            max-width: 140px;
            margin: 10px auto 15px auto;
        }

        .gauge path.bg-arc {
            stroke: var(--bg-color);
        }

        .gauge line.needle {
            transform-origin: 50px 45px;
            transition: transform 0.4s cubic-bezier(0.17, 0.67, 0.83, 0.67);
            stroke: var(--accent-blue);
        }

        .chart-container {
            min-height: 280px;
        }

        .unit {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        .config-btn {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            background: rgba(0, 122, 255, 0.1);
            padding: 6px 14px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .config-btn:hover {
            background: rgba(0, 122, 255, 0.2);
        }

        .gpio-badge {
            display: flex;
            flex-flow: row;
            position: relative;
            justify-content: space-evenly;
            align-items: center;
            gap: 8px;
            background: var(--bg-color);
            padding: 10px 16px;
            border-radius: 10px;
            border: 0.5px solid var(--border-color);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .gpio-badge.clickable {
            cursor: pointer;
        }

        .gpio-badge.clickable:hover {
            background: rgba(0, 122, 255, 0.05);
            border-color: var(--accent-blue);
        }

        .analog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            width: 100%;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <label class="card-label" style="display:flex; flex-flow:row; justify-content:space-between; align-items:center;">
            <span id="dev-model" style="font-size: 18px; font-weight:700; color:var(--text-primary);">System Name</span>
            <div class="card_text">
                <div class="dot" id="conn-dot"></div>
                <span id="conn-text">Connecting...</span>
            </div>
            <a href="/config" class="config-btn">Settings</a>
        </label>

        <!-- Digital Channels Container -->
        <div class="card" id="gpio-container">
            <div class="card-label" style="margin-bottom: 12px;">Digital Controls</div>
            <div id="gpio-badges" style="display:flex; flex-flow:row; flex-wrap:wrap; gap:10px;"></div>
        </div>

        <!-- Analog Channels Container -->
        <div class="card" id="analog-container">
            <div class="card-label" style="margin-bottom: 12px;">Analog & System Metrics</div>
            <div style="display:flex; flex-flow:row; flex-wrap:wrap; gap:20px;">
                <div id="analog-cards" class="analog-grid"></div>
                <div class="chart-container" style="flex-grow:1; min-width: 300px;">
                    <canvas id="voltageChart"></canvas>
                </div>
            </div>
        </div>

        <!-- System Footer Stats -->
        <div id="system-gauges" class="card" style="flex-flow:row; justify-content: space-evenly;">
            <div class="card_text">Version: <span id="sys-ver" class="sys-val">--</span></div>
            <div class="card_text">ID: <span id="dev-id" class="sys-val">--</span></div>
            <div class="card_text">Uptime: <span id="dev-uptime" class="sys-val">--</span></div>
        </div>
    </div>

    <script>
        const MAX_POINTS = 60;
        let lastChartUpdate = 0;

        // Map array index (0, 1, 2...) -> DOM/Chart layout information
        const channelMap = {};

        function toggleChannel(chIndex) {
            fetch(`/channel/${chIndex}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "error") {
                        console.error(`Toggle failed on channel ${chIndex}`);
                    }
                })
                .catch(err => console.error(err));
        }

        const ctx = document.getElementById('voltageChart').getContext('2d');
        const chartColors = ['#007AFF', '#34C759', '#FF9500', '#AF52DE', '#FF3B30', '#5856D6'];

        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(MAX_POINTS).fill(''),
                datasets: []
            },
            options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                scales: {
                    y: {
                        grid: { color: '#E5E5EA' },
                        ticks: { color: '#8E8E93', font: { family: '-apple-system' } }
                    },
                    x: { display: false }
                },
                plugins: {
                    legend: { labels: { color: '#1C1C1E', usePointStyle: true, boxWidth: 8, font: { family: '-apple-system', weight: '500' } } }
                }
            }
        });

        // --- LOAD SETTINGS & BUILD DYNAMIC UI ---
        fetch('/settings')
            .then(res => res.json())
            .then(data => {
                if (data.mqtt && data.mqtt.device_name) {
                    document.getElementById('dev-model').textContent = data.mqtt.device_name;
                    document.getElementById('title-id').textContent = data.mqtt.device_name + ' | Dashboard';
                }
                if (data.version !== undefined) document.getElementById('sys-ver').textContent = data.version;
                if (data.device_id) document.getElementById('dev-id').textContent = data.device_id;

                if (data.channels && Array.isArray(data.channels)) {
                    let digitalHtml = '';
                    let analogHtml = '';
                    let colorIdx = 0;

                    data.channels.forEach((ch, index) => {
                        const chName = (ch.ha && ch.ha.name) ? ch.ha.name : `Channel ${index}`;
                        const unit = (ch.ha && ch.ha.unit_of_measurement) ? ch.ha.unit_of_measurement : '';

                        if (ch.type === 0) { 
                            // DIGITAL CHANNEL (type = 0)
                            channelMap[index] = { type: 'digital' };

                            const isOutput = ch.is_output;
                            const clickAttr = isOutput ? `onclick="toggleChannel(${index})" title="Toggle Channel ${index}"` : `title="Input Channel"`;
                            const badgeClass = isOutput ? 'gpio-badge clickable' : 'gpio-badge';

                            digitalHtml += `
                            <div class="${badgeClass}" ${clickAttr}>
                                <div class="dot" id="dot-${index}"></div>
                                <span>${chName}</span>
                            </div>`;
                        } else {
                            // ANALOG & SYSTEM CHANNELS (type > 0)
                            const dsIndex = chart.data.datasets.length;
                            channelMap[index] = { type: 'analog', datasetIndex: dsIndex };
                            const color = chartColors[colorIdx % chartColors.length];

                            analogHtml += `
                            <div class="card" style="padding:12px; align-items:center;">
                                <div class="card-label">${chName}</div>
                                <div class="gauge-container">
                                    <svg viewBox="0 0 100 50" class="gauge">
                                        <path class="bg-arc" d="M 10 45 A 40 40 0 0 1 90 45" fill="none" stroke-width="8" stroke-linecap="round"/>
                                        <line class="needle" id="needle-${index}" x1="50" y1="45" x2="50" y2="10" stroke-width="3" stroke-linecap="round" style="transform: rotate(-90deg); stroke: ${color};"/>
                                        <circle cx="50" cy="45" r="5" fill="${color}"/>
                                    </svg>
                                </div>
                                <div><span class="card-value" id="val-${index}">--.--</span><span class="unit">${unit}</span></div>
                            </div>`;

                            chart.data.datasets.push({
                                label: chName,
                                borderColor: color,
                                backgroundColor: color,
                                data: Array(MAX_POINTS).fill(null),
                                borderWidth: 3, pointRadius: 0, tension: 0.3
                            });
                            colorIdx++;
                        }
                    });

                    if (digitalHtml) {
                        document.getElementById('gpio-badges').innerHTML = digitalHtml;
                        document.getElementById('gpio-container').classList.remove('hidden');
                    } else {
                        document.getElementById('gpio-container').classList.add('hidden');
                    }

                    if (analogHtml) {
                        document.getElementById('analog-cards').innerHTML = analogHtml;
                        document.getElementById('analog-container').classList.remove('hidden');
                        chart.update();
                    } else {
                        document.getElementById('analog-container').classList.add('hidden');
                    }
                }
            })
            .catch(err => console.error("Error loading settings:", err));

        // --- HANDLE SSE REALTIME STREAM ---
        const evtSource = new EventSource('/events');
        const connDot = document.getElementById('conn-dot');
        const connText = document.getElementById('conn-text');

        evtSource.onopen = () => { 
            connDot.classList.add('active'); 
            connText.textContent = "Live"; 
        };

        evtSource.onmessage = (e) => {
            try {
                // Expected format: {"0": 1, "1": 3.28, "2": 26760}
                const payload = JSON.parse(e.data);
                if (typeof payload !== 'object' || payload === null) return;

                if (payload.MESSAGE) {
                    alert(payload.MESSAGE);
                    return;
                }

                for (const [key, val] of Object.entries(payload)) {
                    const index = parseInt(key, 10);
                    if (Number.isNaN(index)) continue;

                    const mapInfo = channelMap[index];
                    if (!mapInfo) continue; // Ignore indices not configured in settings

                    if (mapInfo.type === 'digital') {
                        const dotEl = document.getElementById(`dot-${index}`);
                        if (dotEl) {
                            val ? dotEl.classList.add('active') : dotEl.classList.remove('active');
                        }
                    } 
                    else if (mapInfo.type === 'analog') {
                        // 1. Push to Line Chart
                        const ds = chart.data.datasets[mapInfo.datasetIndex];
                        if (ds) {
                            ds.data.push(val);
                            ds.data.shift();
                        }

                        // 2. Update Numeric Text & Gauge Needle Angle
                        const valEl = document.getElementById(`val-${index}`);
                        const needleEl = document.getElementById(`needle-${index}`);
                        if (valEl) {
                            valEl.textContent = (typeof val === 'number') ? val.toFixed(2) : val;
                        }
                        if (needleEl && typeof val === 'number') {
                            // Scale angle (-90deg to +90deg) assuming 16.0 max value
                            const angle = Math.max(-90, Math.min(90, (val / 16.0) * 180 - 90));
                            needleEl.style.transform = `rotate(${angle}deg)`;
                        }
                    }
                }

                // Throttle chart redraws to prevent CPU lag
                if (Date.now() - lastChartUpdate > 250) {
                    chart.update();
                    lastChartUpdate = Date.now();
                }
            } catch (err) {
                // Ignore chunk parse errors
            }
        };

        evtSource.onerror = () => { 
            connDot.classList.remove('active'); 
            connText.textContent = "Offline"; 
        };
    </script>
</body>

</html>
